<!doctype html><html lang="om"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imaanaa Social</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f0f2f5;color:#172033}.nav{background:#1877f2;color:white;padding:12px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:5}.wrap{max-width:900px;margin:18px auto;padding:0 10px}.card{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;cursor:pointer}.blue{background:#1877f2;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.gray{background:#e5e7eb}.post img,.post video{max-width:100%;border-radius:10px}.users{display:grid;gap:8px}.user{display:flex;justify-content:space-between;align-items:center;border:1px solid #eee;padding:9px;border-radius:9px}.online{color:#16a34a}.offline{color:#888}.hidden{display:none}.callbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.callbox video{width:100%;background:#111;border-radius:10px;min-height:180px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20}.modal>div{background:#fff;padding:25px;border-radius:15px;text-align:center}.small{font-size:12px;color:#666}.toast{position:fixed;right:15px;bottom:15px;background:#111;color:#fff;padding:10px 15px;border-radius:20px;display:none;z-index:30}@media(max-width:650px){.callbox{grid-template-columns:1fr}}</style></head><body><div class="nav"><b>Imaanaa Social</b><span id="head"></span></div><div class="wrap"><div id="auth" class="card"><h2 id="authTitle">Login</h2><input id="username" class="input" placeholder="Username"><input id="password" class="input" type="password" placeholder="Password"><div id="signupExtra" class="hidden"><input id="phone" class="input" placeholder="Phone"><input id="fullname" class="input" placeholder="Full name"><input id="city" class="input" placeholder="City"><textarea id="bio" class="input" placeholder="Bio"></textarea></div><button class="btn blue" onclick="authGo()" id="authBtn">Login</button><button class="btn gray" onclick="toggleAuth()">Signup/Login</button></div><div id="app" class="hidden"><div class="card"><b>VIP:</b> <span id="vip"></span></div><div class="card"><h3>Profile</h3><input id="pfull" class="input" placeholder="Full name"><input id="pphone" class="input" placeholder="Phone"><input id="pcity" class="input" placeholder="City"><textarea id="pbio" class="input" placeholder="Bio"></textarea><button class="btn green" onclick="saveProfile()">Update</button></div><div class="card"><h3>Maammiltoota</h3><div id="users" class="users"></div></div><div class="card"><h3>Post</h3><textarea id="postText" class="input" placeholder="Maaltu jira?"></textarea><input id="postFile" class="input" type="file" accept="image/*,video/*,audio/*"><button class="btn blue" onclick="submitPost()">Post</button><div class="small">Ati “posted” qofa argita; admin review isaa user irraa dhokataa dha.</div></div><div class="card"><h3>Feed</h3><div id="feed"></div></div><div class="card"><button class="btn red" onclick="logout()">Logout</button></div></div></div><div id="callModal" class="modal"><div><h3 id="caller"></h3><button class="btn green" onclick="acceptCall()">Accept 📞</button><button class="btn red" onclick="rejectCall()">Reject</button></div></div><div id="callCard" class="modal"><div style="width:min(900px,95vw)"><h3 id="callTitle">Call</h3><div class="callbox"><video id="local" autoplay muted playsinline></video><video id="remote" autoplay playsinline></video></div><button class="btn red" onclick="endCall()">End</button><button class="btn blue" onclick="toggleRecording()" id="recordBtn">Start Record</button><button class="btn gray" onclick="downloadRecording()">Download Record</button></div></div><div id="toast" class="toast"></div><audio id="ringtone" loop src="https://actions.google.com/sounds/v1/ambiences/office_phone_ring.ogg"></audio><script src="/socket.io/socket.io.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script><script src="/app.js"></script></body></html>
