<!doctype html><html lang="om"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Imaanaa Social</title><style>body{font-family:Arial;background:#0b141a;color:white;margin:0;padding:20px}.card{background:#111b21;border:1px solid #2a3942;padding:15px;margin-bottom:15px;border-radius:10px}.btn{padding:8px 12px;border:0;border-radius:7px;margin:4px;cursor:pointer}.green{background:#00a884;color:white}.red{background:#ea4335;color:white}.input{padding:9px;margin:4px;background:#202c33;color:white;border:1px solid #2a3942;border-radius:6px}.media{max-width:300px;max-height:220px}</style></head><body><h2>🛡️ Admin Moderation</h2><div class="card"><input id="u" class="input" placeholder="Admin username"><input id="p" class="input" type="password" placeholder="Admin password"><button class="btn green" onclick="login()">Login</button><button class="btn" onclick="logout()">Logout</button></div><div id="panel" style="display:none"><div class="card"><h3>Pending Posts</h3><div id="posts"></div></div><div class="card"><h3>Users / Moderation</h3><div id="users"></div></div></div><script>let t=localStorage.getItem('admin_token');const A=id=>document.getElementById(id);async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:`Bearer ${t}`,'Content-Type':'application/json'};let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.message||'Error');return d}async function login(){let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:A('u').value,password:A('p').value})}).then(x=>x.json());if(!r.user?.is_admin)return alert('Admin miti.');t=r.token;localStorage.setItem('admin_token',t);load()}function logout(){localStorage.removeItem('admin_token');location.reload()}async function load(){if(!t)return;try{let ps=await api('/api/admin/pending-posts');A('posts').innerHTML=ps.map(p=>`<div class="card"><b>@${p.username}</b><p>${p.content||''}</p>${p.media_url?(p.media_type==='video'?`<video class="media" controls src="${p.media_url}"></video>`:p.media_type==='audio'?`<audio controls src="${p.media_url}"></audio>`:`<img class="media" src="${p.media_url}">`):''}<br><button class="btn green" onclick="act(${p.id},'approve-post')">Approve</button><button class="btn red" onclick="act(${p.id},'delete-post')">Reject/Delete</button></div>`).join('')||'No pending post';let us=await api('/api/admin/users');A('users').innerHTML=us.map(u=>`<div class="card"><b>@${u.username}</b> ${u.is_vip?'⭐VIP':''}<br><button class="btn red" onclick="ban('${u.username}')">Ban 3 days</button><button class="btn" onclick="warn('${u.username}')">Warn</button></div>`).join('');A('panel').style.display='block'}catch(e){alert(e.message)}}async function act(id,a){await api('/api/admin/'+a,{method:'POST',body:JSON.stringify({postId:id})});load()}async function ban(u){await api('/api/admin/ban-user',{method:'POST',body:JSON.stringify({username:u,days:3,reason:'Content moderation'})});load()}async function warn(u){await api('/api/admin/warn-user',{method:'POST',body:JSON.stringify({username:u,reason:'Content moderation'})});load()}load()</script></body></html>
