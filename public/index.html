<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImaanaaCall</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b141a; color: #e9edef; margin: 0; padding: 0; }
    .header { background-color: #202c33; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    .container { max-width: 500px; margin: 0 auto; padding: 15px; }
    
    .login-card { background: #111b21; padding: 25px; border-radius: 12px; text-align: center; margin-top: 50px; }
    input[type="text"] { width: 80%; padding: 12px; border-radius: 8px; border: 1px solid #2a3942; background: #202c33; color: white; outline: none; margin-bottom: 15px; font-size: 16px; }
    
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .btn-green { background: #00a884; color: #111b21; }
    .btn-danger { background: #ea4335; color: white; }
    .btn-call { background: #00a884; color: white; padding: 6px 12px; border-radius: 20px; text-decoration: none; font-size: 14px; }

    .online-section { background: #111b21; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
    .user-card { display: flex; justify-content: space-between; align-items: center; background: #202c33; padding: 10px 15px; border-radius: 8px; margin-top: 8px; }
    
    .chat-box { background: #0b141a; min-height: 250px; max-height: 350px; overflow-y: auto; padding: 10px; border-radius: 8px; border: 1px solid #2a3942; margin-bottom: 15px; }
    .msg-bubble { background: #005c4b; padding: 8px 12px; border-radius: 8px; margin-bottom: 10px; max-width: 80%; width: fit-content; }
    .msg-user { font-size: 12px; color: #25d366; font-weight: bold; margin-bottom: 3px; }

    /* Ringing Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-box { background: #111b21; padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 4px 25px rgba(0,0,0,0.6); }
    .pulse-ring { width: 70px; height: 70px; background: #00a884; border-radius: 50%; margin: 0 auto 15px; animation: pulse 1.4s infinite; }
    @keyframes pulse { 0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0, 168, 132, 0.7); } 70% { transform: scale(1.05); box-shadow: 0 0 0 18px rgba(0, 168, 132, 0); } 100% { transform: scale(0.9); } }
  </style>
</head>
<body>

  <div class="header">
    <h2 style="margin: 0; font-size: 20px;">ImaanaaCall</h2>
    <span id="status-badge" style="color: #00a884; font-size: 14px;">● Offline</span>
  </div>

  <div class="container">
    
    <!-- LOGIN -->
    <div id="login-section" class="login-card">
      <h3>Baga Dhuftan!</h3>
      <input type="text" id="username-input" placeholder="Maqaa keessan galchaa..."> <br>
      <button class="btn btn-green" onclick="register()">Seeni</button>
    </div>

    <!-- MAIN APP -->
    <div id="app-section" style="display: none;">
      
      <!-- ONLINE USERS -->
      <div class="online-section">
        <h4 style="margin: 0 0 10px 0; color: #8696a0;">Users Online</h4>
        <div id="users-container"><small style="color: #8696a0;">Maammilli biraa hin jiru...</small></div>
      </div>

      <!-- CHAT MESSAGES -->
      <div class="chat-box" id="chat-box"></div>

      <!-- INPUT BOX -->
      <div style="display: flex; gap: 8px;">
        <input type="text" id="msg-input" placeholder="Ergaa barreessaa..." style="margin: 0; flex: 1;">
        <button class="btn btn-green" onclick="sendMessage()">Send</button>
      </div>

    </div>

  </div>

  <!-- INCOMING CALL MODAL -->
  <div id="call-modal" class="modal">
    <div class="modal-content modal-box">
      <div class="pulse-ring"></div>
      <h3 id="caller-name-text">Someone is calling...</h3>
      <p style="color: #8696a0;">Incoming Audio Call</p>
      <div style="margin-top: 20px; display: flex; gap: 15px; justify-content: center;">
        <button class="btn btn-green" onclick="acceptCall()">Accept 📞</button>
        <button class="btn btn-danger" onclick="rejectCall()">Reject 🚫</button>
      </div>
    </div>
  </div>

  <audio id="ringtone-audio" src="https://actions.google.com/sounds/v1/ambiences/office_phone_ring.ogg" loop></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
