<!doctype html>
<html lang="om">
<head>
<meta charset="utf-8">
<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Imaanaa Social</title>

<style>
:root{
--blue:#1877f2;
--bg:#f0f2f5;
--card:#fff;
--muted:#65676b
}

*{
box-sizing:border-box
}

body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:#111
}

.nav{
position:sticky;
top:0;
z-index:10;
background:#fff;
border-bottom:1px solid #ddd;
padding:10px 16px;
display:flex;
justify-content:space-between;
align-items:center
}

.brand{
font-size:24px;
font-weight:800;
color:var(--blue)
}

.wrap{
max-width:900px;
margin:18px auto;
padding:0 10px
}

.card{
background:#fff;
border-radius:12px;
padding:15px;
margin:12px 0;
box-shadow:0 1px 3px #0001
}

.input,
textarea,
select{
width:100%;
padding:11px;
margin:5px 0;
border:1px solid #ddd;
border-radius:8px
}

.btn{
border:0;
border-radius:8px;
padding:10px 14px;
margin:3px;
cursor:pointer;
font-weight:700
}

.primary{
background:var(--blue);
color:#fff
}

.green{
background:#42b72a;
color:#fff
}

.red{
background:#e53935;
color:#fff
}

.gray{
background:#e4e6eb
}

.row{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap
}

.avatar{
width:44px;
height:44px;
border-radius:50%;
object-fit:cover;
background:#ddd
}

.status{
display:inline-block;
width:10px;
height:10px;
border-radius:50%;
background:#bbb
}

.on{
background:#31a24c
}

.post img,
.post video{
width:100%;
max-height:520px;
object-fit:contain;
border-radius:10px;
margin-top:8px
}

.tabs{
display:flex;
gap:5px;
overflow:auto
}

.tabs button{
white-space:nowrap
}

.hidden{
display:none!important
}

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  z-index: 9999; /* Elements hunda gubbaa akka ta'uuf */
  display: none;
  align-items: center;
  justify-content: center;
}

/* Modal yeroo banamu display flex akka ta'u gochuuf */
.modal.show {
  display: flex !important;
}

.modal > div {
  background: #fff;
  border-radius: 14px;
  padding: 20px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}
.chatbox{
height:360px;
overflow:auto;
border:1px solid #ddd;
border-radius:10px;
padding:10px
}

.bubble{
padding:8px 11px;
border-radius:12px;
background:#eee;
margin:5px;
max-width:75%
}

.mine{
margin-left:auto;
background:#dbeafe
}

.small{
color:var(--muted);
font-size:13px
}
</style>
</head>

<body>

<div class="nav">
<div class="brand">
Imaanaa Social
</div>

<div id="head"></div>
</div>

<div class="wrap">

<section id="auth" class="card">

<h2 id="authTitle">
Login
</h2>

<input
id="username"
class="input"
placeholder="Username">

<input
id="password"
class="input"
type="password"
placeholder="Password">

<div id="signupFields"
class="hidden">

<input
id="fullName"
class="input"
placeholder="Maqaa guutuu">

<input
id="phone"
class="input"
placeholder="Phone">

<input
id="city"
class="input"
placeholder="Magaalaa">

<select
id="gender"
class="input">

<option value="">
Saala
</option>

<option>
Male
</option>

<option>
Female
</option>

</select>

<textarea
id="bio"
placeholder="Bio">
</textarea>

</div>

<button
class="btn primary"
id="authBtn"
onclick="auth()">
Login
</button>

<button
class="btn gray"
onclick="toggleAuth()">
Signup/Login
</button>

</section>

<section id="app" class="hidden">

<div class="tabs">

<button
class="btn primary"
onclick="show('home')">
Home
</button>

<button
class="btn gray"
onclick="show('people')">
People
</button>

<button
class="btn gray"
onclick="show('chat')">
Chat
</button>

<button
class="btn gray"
onclick="show('profile')">
Profile
</button>

<button
class="btn gray"
onclick="show('saved')">
Saved
</button>

</div>

<div id="vip" class="card"></div>

<div id="home">

<div class="card">

<h3>
Post Haaraa
</h3>

<textarea
id="postText"
placeholder="Maaltu jira?">
</textarea>

<input
id="media"
type="file"
accept="image/*,video/*,audio/*"
class="input">

<button
class="btn primary"
onclick="createPost()">
Post Godhi
</button>

<p class="small">
Postiin erga ergamee booda
ilaalcha qulqullinaa keessa darba;
yeroo public ta'u notification argatta.
</p>

</div>

<div id="feed"></div>

</div>

<div id="people" class="hidden">

<div class="card">

<h3>
Maammiltoota
</h3>

<div id="users"></div>

</div>

<div class="card">

<h3>
Friend Requests
</h3>

<div id="requests"></div>

</div>

</div>

<div id="chat" class="hidden">

<div class="card">

<h3>
Chat
</h3>

<select
id="chatUser"
class="input"
onchange="loadChat()">
</select>

<div
id="chatbox"
class="chatbox">
</div>

<div class="row">

<input
id="chatText"
class="input"
style="flex:1"
placeholder="Ergaa...">

<button
class="btn primary"
onclick="sendChat()">
Send
</button>

</div>

</div>

</div>

<div id="profile" class="hidden">

<div class="card">

<h3>
Profile Edit
</h3>

<input
id="pname"
class="input"
placeholder="Maqaa guutuu">

<input
id="pphone"
class="input"
placeholder="Phone">

<input
id="pcity"
class="input"
placeholder="City">

<textarea
id="pbio"
class="input"
placeholder="Bio">
</textarea>

<input
id="avatar"
type="file"
accept="image/*"
class="input">

<input
id="cover"
type="file"
accept="image/*"
class="input">

<button
class="btn green"
onclick="saveProfile()">
Save Profile
</button>

</div>

</div>

<div id="saved" class="hidden">

<div class="card">

<h3>
Saved Posts
</h3>

<div id="savedFeed"></div>

</div>

</div>

</section>

</div>
  
<!-- Incoming Call Modal -->
<div id="callModal" class="modal">
  <div>
    <h2 id="caller">Waamicha...</h2>
    <div class="row" style="justify-content: center; margin-top: 15px;">
      <button class="btn green" id="acceptCallBtn" onclick="acceptCall()">Accept</button>
      <button class="btn red" id="rejectCallBtn" onclick="rejectCall()">Reject</button>
    </div>
  </div>
</div>

<!-- Active Call Screen Modal -->
<div id="callScreen" class="modal">
  <div>
    <h3>Voice/Video Call</h3>
    <div class="row" style="margin-bottom: 15px;">
      <video id="local" autoplay muted playsinline style="width:48%; background: #000; border-radius: 8px;"></video>
      <video id="remote" autoplay playsinline style="width:48%; background: #000; border-radius: 8px;"></video>
    </div>
    <button class="btn red" id="endCallBtn" onclick="endCall()">End Call</button>
  </div>
</div>

<button
class="btn red"
onclick="endCall()">
End
</button>

</div>

</div>

<audio
id="ringtone"
loop
src="https://actions.google.com/sounds/v1/ambiences/office_phone_ring.ogg">
</audio>

<script src="/socket.io/socket.io.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js">
</script>

<script src="app.js"></script>

</body>
</html>
