<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImaanaaCall Premium</title>
  <style>
    body { font-family: sans-serif; background-color: #0b141a; color: #e9edef; margin: 0; padding-bottom: 60px; }
    .header { background: #202c33; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
    .container { max-width: 600px; margin: auto; padding: 12px; }
    .card { background: #111b21; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a3942; }
    .btn { padding: 8px 16px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
    .btn-green { background: #00a884; color: #111b21; }
    .btn-blue { background: #007bff; color: white; }
    .btn-danger { background: #ea4335; color: white; }
    input[type="text"], textarea { width: 95%; background: #202c33; border: 1px solid #2a3942; color: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; background: #202c33; padding: 8px; border-radius: 6px; margin-top: 5px; }
    
    /* Ad Banner Slot (Galii Monetization) */
    .ad-slot { background: #1f2c34; border: 1px dashed #00a884; padding: 10px; text-align: center; border-radius: 8px; margin-bottom: 15px; font-size: 13px; color: #00a884; }

    /* Post Feed */
    .post { background: #202c33; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
    .post media, .post img, .post video { max-width: 100%; border-radius: 6px; margin-top: 8px; }
    
    .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); justify-content:center; align-items:center; z-index:100; }
  </style>
</head>
<body>

  <div class="header">
    <h3 style="margin:0;">ImaanaaCall</h3>
    <span id="vip-status" style="color: #ffc107; font-weight: bold;">FREE PLAN</span>
  </div>

  <div class="container">

    <!-- Monetization Banner (AdSense / Sponsors) -->
    <div class="ad-slot">
      <b>📢 Beeksisa (Sponsor):</b> Bankii / Dhaabbata keessaniif beeksisa asirratti maxxansaa! <br>
      <button class="btn btn-blue" style="margin-top:5px;" onclick="alert('VIP Banachuuf Telegram: @your_admin contact godhaa')">⭐ Upgrade VIP ($2/Month)</button>
    </div>

    <!-- Login -->
    <div id="login-sec" class="card">
      <h3>Seensa / Login</h3>
      <input type="text" id="username-in" placeholder="Maqaa keessan...">
      <button class="btn btn-green" onclick="login()">Seeni</button>
    </div>

    <div id="main-sec" style="display: none;">
      
      <!-- Users Online -->
      <div class="card">
        <h4>Users Online</h4>
        <div id="users-list"></div>
      </div>

      <!-- POST CREATION FEED -->
      <div class="card">
        <h4>Post Haaraa Maxxansi</h4>
        <textarea id="post-text" placeholder="Maaltu jira..."></textarea>
        <input type="file" id="post-file" accept="image/*,video/*,audio/*">
        <button class="btn btn-green" onclick="submitPost()">Post Godhi</button>
      </div>

      <!-- POSTS TIMELINE -->
      <h3>Post Feed</h3>
      <div id="posts-feed"></div>

    </div>

  </div>

  <!-- CALL MODAL -->
  <div id="call-modal" class="modal">
    <div style="background:#111b21; padding:25px; border-radius:12px; text-align:center;">
      <h3 id="caller-txt">Call...</h3>
      <button class="btn btn-green" onclick="acceptCall()">Accept 📞</button>
      <button class="btn btn-danger" onclick="rejectCall()">Reject 🚫</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
