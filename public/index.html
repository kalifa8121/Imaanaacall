<!DOCTYPE html>
<html lang="om" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imaanaa Social - Customer Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full text-slate-800 antialiased flex flex-col">
  <div class="flex-1 flex flex-col h-screen overflow-hidden">
    <header class="bg-blue-600 text-white shadow-md p-4 flex justify-between items-center">
      <h1 class="font-black text-xl">Imaanaa Social Platform</h1>
      <button onclick="logout()" class="bg-blue-700 px-3 py-1 rounded text-xs font-bold">Ba'i (Logout)</button>
    </header>
    
    <div class="flex-1 flex overflow-hidden">
      <main class="flex-1 p-6 overflow-y-auto">
        <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow">
          <h2 class="font-bold text-lg mb-4">Customer Feed & Posting</h2>
          <textarea id="postContent" placeholder="Maal yaadaa jirta? Viidiyoo ykn suuraa qoodadhu..." class="w-full border p-3 rounded-xl mb-3 text-sm"></textarea>
          <input type="text" id="mediaUrl" placeholder="Media URL (Viidiyoo/Suuraa)" class="w-full border p-2 rounded-xl mb-3 text-xs">
          <button onclick="createPost()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold w-full">Post Ergi (Pending Admin Approval)</button>
        </div>
      </main>
    </div>
  </div>

  <!-- LOGIN / SIGNUP MODAL (QUICK TEST HIN QABU) -->
  <div id="authModal" class="fixed inset-0 bg-slate-900/80 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <h2 class="text-xl font-bold text-slate-800 mb-4 text-center">Imaanaa Social Seeni</h2>
      <form onsubmit="handleLogin(event)" class="space-y-3">
        <input type="text" id="loginUsername" placeholder="Username" required class="w-full border p-2.5 rounded-xl text-sm">
        <input type="password" id="loginPassword" placeholder="Password" required class="w-full border p-2.5 rounded-xl text-sm">
        <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl">Seeni (Login)</button>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;

    async function handleLogin(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (data.success) {
        currentUser = data.user;
        if (currentUser.is_admin) {
          window.location.href = '/admin.html'; // Kallattiin gara Admin Dashboarditti darba
        } else {
          document.getElementById('authModal').classList.add('hidden');
        }
      } else {
        alert(data.error);
      }
    }

    async function createPost() {
      const content = document.getElementById('postContent').value;
      const mediaUrl = document.getElementById('mediaUrl').value;
      const res = await fetch('/api/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.id, content, mediaUrl, mediaType: mediaUrl ? 'video' : 'none' })
      });
      const data = await res.json();
      alert(data.message);
    }

    function logout() { location.reload(); }
  </script>
</body>
</html>
