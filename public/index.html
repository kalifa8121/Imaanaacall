<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImaanaaCall</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    .user-list { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .user-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px; background: #334155; border-radius: 5px; }
    .btn { padding: 6px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    .btn-call { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    
    /* Call Modal / Pop-up */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
    .modal-content { background: #1e293b; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .ring-animation { width: 80px; height: 80px; border-radius: 50%; background: #10b981; margin: 0 auto 20px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
  </style>
</head>
<body>
  <div class="container">
    <h2>ImaanaaCall</h2>
    
    <div id="login-section">
      <input type="text" id="username-input" placeholder="Maqaa keessan galchaa...">
      <button class="btn btn-call" onclick="register()">Seeni</button>
    </div>

    <div id="app-section" style="display: none;">
      <div class="user-list">
        <h3>Hiriyyoota Onlaayinii jiran</h3>
        <div id="users-container"></div>
      </div>
    </div>
  </div>

  <!-- Incoming Call Modal -->
  <div id="call-modal" class="modal">
    <div class="modal-content">
      <div class="ring-animation"></div>
      <h3 id="caller-name-text">Kalifa is calling...</h3>
      <p id="call-type-text">Voice Call</p>
      <div style="margin-top: 20px;">
        <button class="btn btn-call" onclick="acceptCall()">Fudhadhu (Accept)</button>
        <button class="btn btn-danger" onclick="rejectCall()">Lakkii (Reject)</button>
      </div>
    </div>
  </div>

  <audio id="ringtone-audio" src="https://actions.google.com/sounds/v1/ambiences/office_phone_ring.ogg" loop></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
