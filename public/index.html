<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImaanaaCall Modern Social</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0b141a; color: #e9edef; margin: 0; padding-bottom: 50px; }
    .header { background: #202c33; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; sticky: top; }
    .container { max-width: 600px; margin: auto; padding: 12px; }
    .card { background: #111b21; border-radius: 10px; padding: 15px; margin-bottom: 15px; border: 1px solid #2a3942; }
    
    .btn { padding: 8px 14px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn-green { background: #00a884; color: #111b21; }
    .btn-blue { background: #007bff; color: white; }
    .btn-danger { background: #ea4335; color: white; }
    .btn-secondary { background: #3b4a54; color: white; }

    input[type="text"], textarea { width: 95%; background: #202c33; border: 1px solid #2a3942; color: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    
    .ad-slot { background: #1f2c34; border: 1px dashed #00a884; padding: 12px; text-align: center; border-radius: 8px; margin-bottom: 15px; font-size: 13px; color: #00a884; }

    .user-row { display: flex; justify-content: space-between; align-items: center; background: #202c33; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
    .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    .online { background-color: #25d366; }
    .offline { background-color: #ea4335; }

    .post { background: #202c33; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .post img, .post video { max-width: 100%; border-radius: 6px; margin-top: 8px; display: block; }

    .comment-box { background: #111b21; padding: 8px; border-radius: 6px; margin-top: 8px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
  </style>
</head>
<body>

  <div class="header">
    <h3 style="margin: 0; color: #00a884;">ImaanaaCall</h3>
    <span id="vip-status" style="color: #ffc107; font-weight: bold;">FREE PLAN</span>
  </div>

  <div class="container">

    <!-- Monetization / Support Banner -->
    <div class="ad-slot">
      <b>📢 Beeksisa (Sponsor):</b> Bankii / Dhaabbata keessaniif beeksisa asirratti maxxansaa! <br>
      <button class="btn btn-blue" style="margin-top:6px;" onclick="showVipInfo()">⭐ Upgrade VIP ($2/Month)</button>
    </div>

    <!-- REGISTER / LOGIN CARD -->
    <div id="login-sec" class="card">
      <h3>Galmee fi Seensa Maammilaa</h3>
      <input type="text" id="username-in" placeholder="Maqaa keessan (Username)...">
      <input type="text" id="phone-in" placeholder="Lakkoofsa Bilbilaa...">
      <textarea id="bio-in" placeholder="Odeeffannoo gabaabaa (Bio)..."></textarea>
      <button class="btn btn-green" onclick="registerAndLogin()">Seeni / Galma'i</button>
    </div>

    <!-- MAIN APP INTERFACE -->
    <div id="main-sec" style="display: none;">

      <!-- USERS LIST (ONLINE & OFFLINE) -->
      <div class="card">
        <h4>Maammiltoota (Users List)</h4>
        <div id="users-container"></div>
      </div>

      <!-- POST CREATION WITH LIVE RECORDING -->
      <div class="card">
        <h4>Maxxansa Haaraa (Post Feed)</h4>
        <textarea id="post-text" placeholder="Maaltu jira..."></textarea>
        
        <input type="file" id="post-file" accept="image/*,video/*,audio/*">
        
        <div style="margin: 10px 0; display: flex; gap: 8px;">
          <button class="btn btn-secondary" onclick="startLiveRecord()">📹 Live Record</button>
          <button class="btn btn-danger" id="stop-rec-btn" style="display:none;" onclick="stopLiveRecord()">⏹️ Stop Record</button>
        </div>

        <video id="live-preview" style="display:none; max-width: 100%;" autoplay muted></video>

        <button class="btn btn-green" style="width: 100%; margin-top: 8px;" onclick="submitPost()">Post Godhi</button>
      </div>

      <!-- POSTS FEED TIMELINE -->
      <h3>Post Feed</h3>
      <div id="posts-feed"></div>

    </div>

  </div>

  <!-- INCOMING CALL MODAL WITH RINGTONE -->
  <div id="call-modal" class="modal">
    <div style="background: #111b21; padding: 30px; border-radius: 12px; text-align: center;">
      <h3 id="caller-txt">Someone is calling...</h3>
      <div style="display: flex; gap: 15px; justify-content: center; margin-top: 15px;">
        <button class="btn btn-green" onclick="acceptCall()">Accept 📞</button>
        <button class="btn btn-danger" onclick="rejectCall()">Reject 🚫</button>
      </div>
    </div>
  </div>

  <audio id="ringtone-audio" src="https://actions.google.com/sounds/v1/ambiences/office_phone_ring.ogg" loop></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
