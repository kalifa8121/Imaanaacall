<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Biz App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0e1621; color: #ffffff; }
        .chat-scroll::-webkit-scrollbar { width: 4px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: #242f3d; }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-2">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-[#17212b] p-6 rounded-2xl w-full max-w-md border border-[#242f3d] text-center">
            <h2 class="text-2xl font-bold text-[#5288c1] mb-4">Seensa Maammiltootaa</h2>
            <input type="text" id="username-input" placeholder="Maqaa keessan galchaa..." class="w-full p-3 rounded-xl bg-[#0e1621] border border-[#242f3d] text-white outline-none mb-4">
            <button onclick="login()" class="w-full bg-[#5288c1] font-bold py-3 rounded-xl">Seeni</button>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div class="w-full max-w-6xl h-[95vh] bg-[#17212b] rounded-2xl border border-[#242f3d] overflow-hidden flex flex-col md:flex-row">
        
        <!-- SIDEBAR -->
        <div class="w-full md:w-80 bg-[#0e1621] border-r border-[#242f3d] flex flex-col">
            <div class="p-4 bg-[#17212b] font-bold text-[#5288c1] border-b border-[#242f3d] flex justify-between">
                <span>🟢 Users Online</span>
                <button onclick="toggleAdminPanel()" class="text-xs bg-amber-600 px-2 py-1 rounded">Admin Panel</button>
            </div>
            <div id="user-list" class="flex-1 overflow-y-auto p-3 space-y-2 chat-scroll"></div>
        </div>

        <!-- CHAT AREA -->
        <div class="flex-1 flex flex-col bg-[#0e1621] relative">
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3 chat-scroll"></div>

            <div class="p-3 bg-[#17212b] flex items-center gap-2">
                <input type="text" id="message-input" placeholder="Ergaa barreessi..." onkeypress="if(event.key==='Enter') sendTextMessage()" class="flex-1 p-3 rounded-full bg-[#0e1621] border border-[#242f3d] text-white outline-none text-sm">
                <button onclick="sendTextMessage()" class="bg-[#5288c1] text-white p-3 rounded-full">➔</button>
                <button id="record-btn" onclick="toggleVoiceRecord()" class="bg-[#242f3d] text-white p-3 rounded-full">🎙️</button>
            </div>

            <!-- CALL OVERLAY -->
            <div id="call-overlay" class="absolute inset-0 bg-[#0e1621]/95 hidden flex-col items-center justify-center p-4 z-40">
                <h3 id="call-status" class="text-xl font-bold mb-4 text-[#5288c1]">Bilbila...</h3>
                <div class="grid grid-cols-2 gap-4 w-full max-w-xl mb-4">
                    <video id="local-video" autoplay muted playsinline class="w-full bg-black rounded-xl aspect-video object-cover"></video>
                    <video id="remote-video" autoplay playsinline class="w-full bg-black rounded-xl aspect-video object-cover"></video>
                </div>
                <div class="flex gap-4">
                    <button id="accept-btn" onclick="acceptCall()" class="bg-green-600 font-bold px-6 py-2 rounded-full hidden">Fudhadhu 📞</button>
                    <button onclick="endCall()" class="bg-red-600 font-bold px-6 py-2 rounded-full">Cufi 🚫</button>
                </div>
            </div>

            <!-- ADMIN CONTROL PANEL MODAL -->
            <div id="admin-modal" class="absolute inset-0 bg-[#0e1621]/95 hidden flex-col p-6 z-50 overflow-y-auto">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold text-amber-500">Too'annoo Galii fi Maammiltootaa (Admin Panel)</h2>
                    <button onclick="toggleAdminPanel()" class="bg-red-600 px-3 py-1 rounded">Cufi</button>
                </div>
                <div id="admin-users-table" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myUsername = '', currentCallTarget = null, peerConnection = null, localStream = null, mediaRecorder = null, audioChunks = [];
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function login() {
            const input = document.getElementById('username-input');
            if (input.value.trim()) {
                myUsername = input.value.trim();
                socket.emit('join', myUsername);
                document.getElementById('login-modal').classList.add('hidden');
            }
        }

        socket.on('user-list', (users) => {
            const listEl = document.getElementById('user-list');
            listEl.innerHTML = '';
            users.forEach(u => {
                if (u.username !== myUsername) {
                    const div = document.createElement('div');
                    div.className = 'flex items-center justify-between p-3 bg-[#17212b] rounded-xl border border-[#242f3d]';
                    div.innerHTML = `
                        <span class="text-sm truncate">${u.username}</span>
                        <div class="flex gap-1">
                            <button onclick="startCall('${u.id}', false)" class="p-2 bg-[#242f3d] rounded-lg text-xs">📞</button>
                            <button onclick="startCall('${u.id}', true)" class="p-2 bg-[#5288c1] rounded-lg text-xs">📹</button>
                        </div>
                    `;
                    listEl.appendChild(div);
                }
            });
        });

        function sendTextMessage() {
            const input = document.getElementById('message-input');
            if (input.value.trim()) {
                socket.emit('send-message', { text: input.value });
                input.value = '';
            }
        }

        socket.on('chat-message', (data) => renderMessage(data));
        socket.on('message-history', (messages) => {
            document.getElementById('messages-container').innerHTML = '';
            messages.forEach(msg => renderMessage(msg));
        });

        function renderMessage(data) {
            const container = document.getElementById('messages-container');
            const isMine = data.sender === myUsername;
            const wrapper = document.createElement('div');
            wrapper.className = `flex flex-col ${isMine ? 'items-end' : 'items-start'}`;
            let body = `<div class="max-w-[75%] p-3 rounded-2xl ${isMine ? 'bg-[#2b5278]' : 'bg-[#182533]'} shadow">
                <div class="text-xs font-bold text-[#64b5f6] mb-1">${data.sender}</div>`;
            if (data.text) body += `<div class="text-sm">${data.text}</div>`;
            if (data.audio) body += `<audio controls src="${data.audio}" class="mt-2 max-w-full h-8"></audio>`;
            body += `</div>`;
            wrapper.innerHTML = body;
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;
        }

        async function toggleVoiceRecord() {
            const btn = document.getElementById('record-btn');
            if (!mediaRecorder || mediaRecorder.state === 'inactive') {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(blob);
                    reader.onloadend = () => socket.emit('send-message', { audio: reader.result });
                };
                mediaRecorder.start();
                btn.classList.add('bg-red-600');
            } else {
                mediaRecorder.stop();
                btn.classList.remove('bg-red-600');
            }
        }

        // Admin Panel Toggle & Data Fetch
        async function toggleAdminPanel() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
            
            if (!modal.classList.contains('hidden')) {
                const res = await fetch('/api/admin/users');
                const users = await res.json();
                const container = document.getElementById('admin-users-table');
                container.innerHTML = users.map(u => `
                    <div class="flex items-center justify-between p-3 bg-[#17212b] rounded-xl border border-[#242f3d]">
                        <div>
                            <p class="font-bold">${u.username}</p>
                            <p class="text-xs text-gray-400">Paid VIP: ${u.is_paid ? 'YES 🟢' : 'NO 🔴'}</p>
                        </div>
                        <button onclick="togglePaidStatus('${u.username}', ${!u.is_paid})" class="px-3 py-1 bg-[#5288c1] rounded text-xs">
                            ${u.is_paid ? 'VIP Irraa Kaasi' : 'VIP Godhi (Kaffaleera)'}
                        </button>
                    </div>
                `).join('');
            }
        }

        async function togglePaidStatus(username, is_paid) {
            await fetch('/api/admin/toggle-paid', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, is_paid })
            });
            toggleAdminPanel();
        }

        // WebRTC Signaling Calls
        let incomingOfferData = null;
        async function initLocalStream(isVideo) {
            localStream = await navigator.mediaDevices.getUserMedia({ video: isVideo, audio: true });
            document.getElementById('local-video').srcObject = localStream;
        }

        function createPeer(targetSocketId) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.ontrack = e => document.getElementById('remote-video').srcObject = e.streams[0];
            peerConnection.onicecandidate = e => {
                if (e.candidate) socket.emit('ice-candidate', { to: targetSocketId, candidate: e.candidate });
            };
        }

        async function startCall(targetSocketId, isVideo) {
            currentCallTarget = targetSocketId;
            document.getElementById('call-overlay').classList.remove('hidden');
            document.getElementById('call-overlay').classList.add('flex');
            await initLocalStream(isVideo);
            createPeer(targetSocketId);
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call-user', { to: targetSocketId, offer, isVideo });
        }

        socket.on('incoming-call', async data => {
            incomingOfferData = data;
            currentCallTarget = data.from;
            document.getElementById('call-overlay').classList.remove('hidden');
            document.getElementById('call-overlay').classList.add('flex');
            document.getElementById('call-status').innerText = `Bilbila ${data.callerName} irraa...`;
            document.getElementById('accept-btn').classList.remove('hidden');
        });

        async function acceptCall() {
            document.getElementById('accept-btn').classList.add('hidden');
            await initLocalStream(incomingOfferData.isVideo);
            createPeer(incomingOfferData.from);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer-call', { to: incomingOfferData.from, answer });
        }

        socket.on('call-answered', async data => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', async data => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });

        socket.on('call-ended', () => resetCallUI());
        function endCall() {
            if (currentCallTarget) socket.emit('end-call', { to: currentCallTarget });
            resetCallUI();
        }

        function resetCallUI() {
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
            document.getElementById('call-overlay').classList.add('hidden');
            document.getElementById('call-overlay').classList.remove('flex');
        }
    </script>
</body>
</html>
